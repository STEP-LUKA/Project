<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foodie - Menu</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="../index.html" class="logo">Foodie</a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
      </nav>
    </div>
    <div class="nav-right" id="nav-auth-area">
      <button type="button" class="cart-btn" aria-label="Shopping Cart">
        🛒 <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
      </button>
      <a href="login.html" id="nav-login-link">Login</a>
      <a href="register.html" class="btn-orange" id="nav-signup-link">Sign Up</a>
    </div>
  </header>

  <main class="menu-page-container">
    <aside class="filters-sidebar">
      <h3>Filters</h3>

      <div class="filter-block">
        <label class="block-label" for="filter-search">Search</label>
        <input type="text" id="filter-search" class="search-input" placeholder="Search dishes..." />
      </div>

      <div class="filter-block">
        <label class="block-label">Categories</label>
        <div class="category-list" id="categories-container"></div>
      </div>

      <div class="filter-block toggle-row">
        <span>Vegetarian Only</span>
        <label class="switch">
          <input type="checkbox" id="filter-vegetarian" />
          <span class="slider-round"></span>
        </label>
      </div>

      <div class="filter-block">
        <label class="block-label" for="filter-spiciness">Spiciness (0-5)</label>
        <input type="range" id="filter-spiciness" class="range-slider" min="-1" max="5" value="-1" />
        <div class="range-subtext" id="spiciness-label">Level: not selected</div>
      </div>

      <div class="filter-block">
        <label class="block-label" for="filter-rating">Minimum Rating</label>
        <input type="range" id="filter-rating" class="range-slider" min="0" max="5" step="0.1" value="0" />
        <div class="range-subtext" id="rating-label">⭐ 0.0+</div>
      </div>

      <div class="filter-block">
        <label class="block-label" for="filter-min-price">Min price</label>
        <input type="range" id="filter-min-price" class="range-slider" min="0" max="100" value="0" />
        <div class="range-subtext" id="min-price-label">$ 0</div>
      </div>

      <div class="filter-block">
        <label class="block-label" for="filter-max-price">Max price</label>
        <input type="range" id="filter-max-price" class="range-slider" min="0" max="500" value="500" />
        <div class="range-subtext" id="max-price-label">$ 500+</div>
      </div>

      <button type="button" class="btn-clear" id="clear-filters-btn">Clear All Filters</button>
    </aside>

    <section class="menu-content">
      <div class="menu-header">
        <h1>Menu</h1>
        <p id="showing-count">Loading products...</p>
      </div>

      <div class="menu-grid" id="menu-products-grid"></div>

      <div class="pagination">
        <button type="button" class="page-btn" id="prev-page-btn" style="display: none;">&lt; Previous</button>
        <button type="button" class="page-btn" id="next-page-btn" style="display: none;">Next &gt;</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-grid">
      <div class="footer-col">
        <h4 class="logo" style="font-size:16px;">Foodie</h4>
        <p>Delicious food delivered to your door</p>
      </div>
      <div class="footer-col">
        <h4>Contact</h4>
        <p>123 Food Street</p>
        <p>Phone: (555) 123-4567</p>
      </div>
      <div class="footer-col">
        <h4>Quick Links</h4>
        <a href="menu.html">Menu</a>
        <a href="../index.html">Home</a>
      </div>
      <div class="footer-col">
        <h4>Newsletter</h4>
        <div class="newsletter-box">
          <input type="email" placeholder="Your email" />
          <button type="button" class="btn-orange">Subscribe</button>
        </div>
      </div>
    </div>
    <div class="copyright">
      <strong>Created by:</strong> <a href="https://stepacademy.ge" target="_blank" rel="noopener">IT Academy STEP Georgia</a>
    </div>
  </footer>

  <script type="module" src="../js/pages/menu.js"></script>
</body>
</html>
